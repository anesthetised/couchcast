# git-cliff configuration: CHANGELOG.md (`just release`) and the notes of
# each GitHub release (.github/workflows/release.yml) come from the
# Conventional Commits in the history. Only what users notice is listed:
# features, fixes and performance; tests, CI, style and chores are not.

[changelog]
header = """
# Changelog

couchcast uses calendar versions: `vYYYY.M.N`, where N counts the releases
within the month. Images are published as `ghcr.io/anesthetised/couchcast`.
"""
# Untrimmed: each release ends with a blank line before the next one.
body = """
{% if version %}\
## [{{ version }}](https://github.com/anesthetised/couchcast/releases/tag/{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}{{ commit.scope }}: {% endif %}\
{{ commit.message | upper_first }} (\
{% for footer in commit.footers | filter(attribute="token", value="Closes") %}\
[#{{ footer.value | trim_start_matches(pat="#") }}](https://github.com/anesthetised/couchcast/issues/{{ footer.value | trim_start_matches(pat="#") }}), \
{% endfor %}\
[{{ commit.id | truncate(length=7, end="") }}](https://github.com/anesthetised/couchcast/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# "@name" in a message would mention (and notify) a GitHub user of that
# name and list them as a release contributor; as code it stays text.
commit_preprocessors = [
  { pattern = '(^|\s)@([A-Za-z0-9][A-Za-z0-9-]*)', replace = '${1}`@${2}`' },
  # Commands stay code (and lowercase): `just release`, `prod-admin-grant`.
  { pattern = '(^|\s)(just [a-z][a-z-]*|prod-[a-z][a-z-]*)', replace = '${1}`${2}`' },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = ".*", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "newest"
