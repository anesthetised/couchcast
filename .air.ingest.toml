# Hot reload for the ingest worker inside the dev container.
root = "."
tmp_dir = "tmp/ingest"

[build]
  cmd = "go build -o ./tmp/ingest/couchcast ./cmd/couchcast"
  bin = "./tmp/ingest/couchcast"
  args_bin = ["ingest"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "web", "db", "deploy", "bin", "data"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = true

[misc]
  clean_on_exit = true
