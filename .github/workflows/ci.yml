name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.13.2
  ATLAS_IMAGE: arigaio/atlas:1.3.0-community

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    permissions:
      contents: write # the coverage badge branch
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: couchcast
          POSTGRES_PASSWORD: couchcast
          POSTGRES_DB: couchcast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U couchcast -d couchcast_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      # Packaging, storyboard and ingest tests render clips with ffmpeg
      # and skip without it.
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg)
      # Object storage tests run against the same SeaweedFS service as
      # development (published on :9000 by compose.dev.yaml).
      - name: Start SeaweedFS
        run: docker compose -f compose.yaml -f compose.dev.yaml up -d --wait seaweedfs
      - name: go test
        env:
          COUCHCAST_TEST_DATABASE_URL: postgres://couchcast:couchcast@localhost:5432/couchcast_test?sslmode=disable
          COUCHCAST_TEST_S3_ENDPOINT: localhost:9000
          COUCHCAST_TEST_S3_ACCESS_KEY: couchcast
          COUCHCAST_TEST_S3_SECRET_KEY: couchcast-dev-secret
        # Packages run serially: integration tests share one database.
        run: go test -p 1 -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      # The README badge reads coverage.json from the `badges` branch via
      # shields.io; the branch holds one commit, replaced on every push.
      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          color=$(awk -v p="$pct" 'BEGIN { print (p >= 80 ? "brightgreen" : p >= 60 ? "yellow" : "red") }')
          mkdir badge && cd badge
          printf '{"schemaVersion":1,"label":"Go coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > coverage.json
          git init -q -b badges
          git add coverage.json
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "coverage $pct%"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" badges

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: couchcast
          POSTGRES_PASSWORD: couchcast
          POSTGRES_DB: couchcast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U couchcast"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      COUCHCAST_DATABASE_URL: postgres://couchcast:couchcast@localhost:5432/couchcast?sslmode=disable
      ATLAS_DEV_URL: postgres://couchcast:couchcast@localhost:5432/atlas_dev?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - name: Create the Atlas dev database
        run: docker exec ${{ job.services.postgres.id }} psql -U couchcast -c 'CREATE DATABASE atlas_dev'
      - name: Define the atlas helper
        run: |
          cat > atlas.sh <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -v "$PWD:/src" -w /src \
            -e COUCHCAST_DATABASE_URL -e ATLAS_DEV_URL "$ATLAS_IMAGE" "$@"
          SH
          chmod +x atlas.sh
      - name: Migration files are consistent (atlas.sum)
        run: ./atlas.sh migrate validate --env local
      - name: Lint the latest migration
        run: ./atlas.sh migrate lint --env local --latest 1
      - name: Migrations apply cleanly
        run: ./atlas.sh migrate apply --env local
      - name: schema.sql matches the migration directory
        run: |
          ./atlas.sh migrate diff ci_check --env local
          if [ -n "$(git status --porcelain db/)" ]; then
            echo "db/schema.sql and db/migrations have diverged; run 'just migrate-diff <name>' and commit the result:"
            git status --porcelain db/
            exit 1
          fi

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # Same stack as locally: Postgres, SeaweedFS, the Go server and Vite in
      # the compose e2e profile, Playwright in its own container.
      - name: Playwright
        run: just e2e
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/report
            e2e/results
          retention-days: 7

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          tags: ghcr.io/anesthetised/couchcast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
