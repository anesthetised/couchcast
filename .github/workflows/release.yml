# Publishes a release when a version tag is pushed (`just release` makes
# one): the multi-arch image on ghcr.io and a GitHub release whose notes
# come from the commits since the previous tag (cliff.toml).
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time; a tag is never published twice concurrently.
concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the image on ghcr.io
      actions: read # the CI status of the tagged commit
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes need the previous tag
      # Calendar versions: vYYYY.M.N, N counting releases within the month;
      # no leading zeros, so the tag is also valid semver.
      - name: Check the tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v20[0-9]{2}\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a version tag (vYYYY.M.N)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # The tag usually arrives with the release commit, whose CI run starts
      # at the same moment: wait for it, and publish only a green commit.
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 80); do
            read -r status conclusion url < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --event push --json status,conclusion,url \
              --jq 'first // empty | "\(.status) \(.conclusion) \(.url)"') || true
            if [ "${status:-}" = completed ]; then
              [ "$conclusion" = success ] && { echo "CI passed: $url"; exit 0; }
              echo "::error::CI for $GITHUB_SHA ended with '$conclusion': $url"
              exit 1
            fi
            echo "CI ${status:-not started yet}; waiting"
            sleep 30
          done
          echo "::error::no finished CI run for $GITHUB_SHA after 40 minutes"
          exit 1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # 2026.9.1, 2026.9 (the newest of the month) and latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=couchcast
            org.opencontainers.image.description=Watch videos together, in sync.
      # The Dockerfile compiles on the build platform for each target, so
      # emulation only runs the runtime stage's package install.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
      - name: Release notes
        run: |
          {
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\` (linux/amd64, linux/arm64). Deploy with \`just deploy ${VERSION}\`."
            echo
            docker run --rm -v "$PWD:/app" -w /app orhunp/git-cliff:2.14.2 --latest --strip all
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
