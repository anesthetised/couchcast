# Base stack, used as-is in production (`just prod-up`) and extended by
# compose.dev.yaml for development. Values with ${VAR:-default} can be
# overridden from .env (see .env.example).

name: couchcast

x-app-env: &app-env
  COUCHCAST_LOG_LEVEL: ${COUCHCAST_LOG_LEVEL:-info}
  COUCHCAST_DATABASE_URL: postgres://${POSTGRES_USER:-couchcast}:${POSTGRES_PASSWORD:-couchcast}@postgres:5432/${POSTGRES_DB:-couchcast}?sslmode=disable
  COUCHCAST_S3_ENDPOINT: rustfs:9000
  COUCHCAST_S3_BUCKET: ${S3_BUCKET:-couchcast}
  COUCHCAST_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-couchcast}
  COUCHCAST_S3_SECRET_KEY: ${S3_SECRET_KEY:-couchcast-dev-secret}
  COUCHCAST_S3_USE_SSL: "false"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-couchcast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-couchcast}
      POSTGRES_DB: ${POSTGRES_DB:-couchcast}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-couchcast} -d ${POSTGRES_DB:-couchcast}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # S3-compatible object storage for packaged media. The web server and
  # the ingest worker create the bucket on start.
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-couchcast}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-couchcast-dev-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Schema migrations. Started explicitly via `just migrate*`, never on boot.
  atlas:
    image: arigaio/atlas:1.3.0-community
    profiles: [tools]
    working_dir: /src
    volumes:
      - ./:/src
    environment:
      COUCHCAST_DATABASE_URL: postgres://${POSTGRES_USER:-couchcast}:${POSTGRES_PASSWORD:-couchcast}@postgres:5432/${POSTGRES_DB:-couchcast}?sslmode=disable
      ATLAS_DEV_URL: postgres://${POSTGRES_USER:-couchcast}:${POSTGRES_PASSWORD:-couchcast}@postgres:5432/atlas_dev?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: runtime
    image: ghcr.io/anesthetised/couchcast:${TAG:-dev}
    command: serve
    environment:
      <<: *app-env
      COUCHCAST_ADDR: ":8080"
      COUCHCAST_SECURE_COOKIES: ${COUCHCAST_SECURE_COOKIES:-true}
      # Required in production; the server refuses to start with a short secret.
      COUCHCAST_MEDIA_TOKEN_SECRET: ${COUCHCAST_MEDIA_TOKEN_SECRET:-}
      # Web Push; empty disables it (`couchcast vapid` prints a pair).
      COUCHCAST_VAPID_PUBLIC_KEY: ${COUCHCAST_VAPID_PUBLIC_KEY:-}
      COUCHCAST_VAPID_PRIVATE_KEY: ${COUCHCAST_VAPID_PRIVATE_KEY:-}
      COUCHCAST_VAPID_SUBJECT: ${COUCHCAST_VAPID_SUBJECT:-}
      # Behind the https profile's Caddy set this to true.
      COUCHCAST_TRUST_PROXY: ${COUCHCAST_TRUST_PROXY:-false}
    ports:
      # Behind Caddy publish it on loopback only: WEB_PORT=127.0.0.1:8080
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    build:
      context: .
      target: runtime
    image: ghcr.io/anesthetised/couchcast:${TAG:-dev}
    command: ingest
    environment:
      <<: *app-env
      COUCHCAST_INGEST_WORKERS: ${COUCHCAST_INGEST_WORKERS:-2}
      COUCHCAST_INGEST_METRICS_ADDR: ":9090"
      COUCHCAST_WORK_DIR: /tmp/couchcast
      COUCHCAST_YTDLP_EXTRA_ARGS: ${COUCHCAST_YTDLP_EXTRA_ARGS:-}
    volumes:
      - ingestwork:/tmp/couchcast
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  # TLS termination for production (`just prod-https`): certificates for
  # COUCHCAST_DOMAIN are obtained and renewed automatically.
  caddy:
    image: caddy:2.10-alpine
    profiles: [https]
    environment:
      COUCHCAST_DOMAIN: ${COUCHCAST_DOMAIN:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
  ingestwork:
  caddydata:
  caddyconfig:
